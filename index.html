<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="wall" id="wallA"></div>
  <div class="wall" id="wallB"></div>
  <div id="shade"></div>
  <div id="wxfx">
    <div class="tilt"><div class="sway">
      <div class="layer" id="fxFar"></div>
      <div class="layer" id="fxNear"></div>
    </div></div>
    <div id="fxFog"></div>
    <div id="fxFlash"></div>
  </div>
  <div id="dim"></div>

  <div id="clockbox">
    <div id="time"><span id="hm">--:--</span><span id="ampm"></span></div>
    <div id="date"></div>
  </div>

  <div id="weather">
    <div id="wxTemp"></div>
    <div id="wxDesc"></div>
    <div id="wxRange"></div>
  </div>

  <div id="cal">
    <div id="calList"></div>
  </div>

  <div id="dockwrap">
    <div id="label"></div>
    <div id="dock"></div>
  </div>

  <div id="credit"></div>
  <div id="toast"></div>

  <div id="picker" class="hidden">
    <h2>Weather location</h2>
    <p>Enter your ZIP code</p>
    <div id="pickDigits"></div>
    <p id="pickMsg"></p>
    <p class="hint">Weather by Open-Meteo.com. Your ZIP code is saved only on this TV.</p>
  </div>

  <div id="calsetup" class="hidden">
    <h2>Calendars</h2>
    <p>On a computer or phone on the same Wi-Fi, open</p>
    <div id="csAddr" class="big"></div>
    <p>and enter this code</p>
    <div id="csCode" class="big"></div>
    <p id="csMsg"></p>
    <p class="hint">Calendar links are saved only on this TV. Back to cancel.</p>
  </div>

  <div id="diag" class="hidden">
    <h2>Diagnostics</h2>
    <p id="diagStatus"></p>
    <pre id="diagList"></pre>
    <p class="hint">↑ or Back to close</p>
  </div>
</div>
<script src="ical.js"></script>
<script src="app.js"></script>
</body>
</html>
